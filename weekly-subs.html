<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাপ্তাহিক চাঁদা - আফাজ উদ্দিন উচ্চ বিদ্যালয় স্কাউট গ্রুপ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .list-container {
            padding: 16px;
        }

        .list-header-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 10px;
        }

        .page-title {
            color: #f8fafc;
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            text-align: left;
        }

        .history-btn {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .history-btn:hover {
            background: #059669;
        }

        /* Filter Section */
        .filter-box {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .filter-box input, .filter-box select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .filter-box select option {
            background: #0f172a;
            color: #f8fafc;
        }

        /* Month and Year Filter Row in One Line */
        .month-year-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .month-year-row select {
            flex: 1;
            padding: 10px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .month-year-row select option {
            background: #0f172a;
            color: #fff;
        }

        /* Scout Row / Card */
        .scout-row {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: 0.2s;
        }
        .scout-row:hover {
            border-color: rgba(59, 130, 246, 0.4);
        }
        .scout-top-info {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }
        .scout-info {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            overflow: hidden;
        }
        .scout-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: #3b82f6;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
        }
        .scout-details h4 {
            color: #f8fafc;
            font-size: 13.5px;
            margin: 0 0 2px 0;
        }
        .scout-details p {
            color: #94a3b8;
            font-size: 11px;
            margin: 0;
        }
        .details-btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }
        .details-btn:hover {
            background: #2563eb;
        }

        .week-box {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            text-align: center;
            padding: 6px;
        }
        .attendance-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #22c55e;
        }

        /* Modal for Details */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-box {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-box h3 {
            color: #f8fafc;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .modal-stats {
            color: #94a3b8;
            font-size: 12.5px;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
        }
        .modal-close-btn {
            margin-top: 15px;
            width: 100%;
            background: #475569;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .unauthorized-msg {
            color: #f43f5e;
            text-align: center;
            margin-top: 50px;
            font-size: 15px;
            font-weight: bold;
            padding: 0 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="app-container" id="mainAppContainer" style="display: none;">
        <div class="list-container">
            
            <div class="list-header-flex">
                <h2 class="page-title" id="pageTitleHeading">সাপ্তাহিক চাঁদা রেজিস্টার</h2>
                <!-- সাধারণ স্কাউট ও অ্যাডাল্ট লিডার উভয়ের জন্যই পেমেন্ট হিস্ট্রি বোতামটি দৃশ্যমান রাখা হয়েছে -->
                <a href="payment-history.html" id="historyBtnLink" class="history-btn">পেমেন্ট হিস্ট্রি</a>
            </div>
            
            <!-- Filters -->
            <div class="filter-box" id="leaderFilterBox">
                <input type="text" id="searchName" placeholder="নাম দিয়ে খুঁজুন...">
                <select id="filterClass">
                    <option value="">সকল ক্লাস নির্বাচন করুন</option>
                    <option value="৬ষ্ঠ">৬ষ্ঠ ক্লাস</option>
                    <option value="৭ম">৭ম ক্লাস</option>
                    <option value="৮ম">৮ম ক্লাস</option>
                    <option value="৯ম">৯ম ক্লাস</option>
                    <option value="১০ম">১০ম ক্লাস</option>
                </select>
                <select id="filterStatus">
                    <option value="all">উভয় (অ্যাক্টিভ + ইনঅ্যাক্টিভ)</option>
                    <option value="active">অ্যাক্টিভ সদস্যগণ</option>
                    <option value="inactive">ইনঅ্যাক্টিভ সদস্যগণ</option>
                </select>
            </div>

            <!-- Month and Year Selection in One Line -->
            <div class="month-year-row" id="monthYearRowBox">
                <select id="selectMonth" onchange="onMonthOrYearChange()">
                    <option value="0">জানুয়ারি</option>
                    <option value="1">ফেব্রুয়ারি</option>
                    <option value="2">মার্চ</option>
                    <option value="3">এপ্রিল</option>
                    <option value="4">মে</option>
                    <option value="5">জুন</option>
                    <option value="6">জুলাই</option>
                    <option value="7">আগস্ট</option>
                    <option value="8">সেপ্টেম্বর</option>
                    <option value="9">অক্টোবর</option>
                    <option value="10">নভেম্বর</option>
                    <option value="11">ডিসেম্বর</option>
                </select>
                <select id="selectYear" onchange="onMonthOrYearChange()">
                    <option value="2024">২০২৪</option>
                    <option value="2025">২০২৫</option>
                    <option value="2026">২০২৬</option>
                    <option value="2027">২০২৭</option>
                </select>
            </div>

            <!-- Scout List for Weekly Subs -->
            <div id="subsListContent">
                <!-- ডাইনামিকালি লোড হবে -->
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="scoutDetailModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalScoutName">সদস্যের নাম</h3>
            <div class="modal-stats" id="modalScoutStats"></div>
            <button type="button" class="modal-close-btn" onclick="closeDetailModal()">বন্ধ করুন</button>
        </div>
    </div>

    <div id="unauthorizedDiv" class="unauthorized-msg" style="display: none;">
        দুঃখিত! এই পেজটি দেখার অনুমতি শুধুমাত্র অ্যাডাল্ট লিডারদের রয়েছে। সাধারণ স্কাউট সদস্য হিসেবে আপনি শুধুমাত্র আপনার নিজের প্রফাইল ও ড্যাশবোর্ড ব্যবহার করতে পারবেন।
    </div>

    <script type="module" src="script.js"></script>
    <script type="module" src="weekly-subs.js"></script>
</body>
</html>
